<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI | Final V3</title>
    <style>
        :root { --glow: #00f2ff; --dark: #000; }
        body { background: var(--dark); margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; overflow: hidden; color: white; }
        .aegis-core { position: relative; width: 250px; height: 250px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top: 4px solid var(--glow); border-bottom: 4px solid var(--glow); animation: rotate 8s linear infinite; }
        .r2 { width: 80%; height: 80%; border-left: 3px dashed var(--glow); border-right: 3px dashed var(--glow); animation: rotate 5s linear reverse infinite; opacity: 0.6; }
        .center-glow { width: 70px; height: 70px; background: radial-gradient(circle, #fff, var(--glow), transparent); border-radius: 50%; box-shadow: 0 0 50px var(--glow); display: flex; align-items: center; justify-content: center; color: #000; font-size: 12px; font-weight: 900; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .console { margin-top: 30px; width: 80%; max-width: 400px; border-left: 3px solid var(--glow); padding: 15px; background: rgba(0, 242, 255, 0.05); }
        #status-txt { font-size: 14px; color: var(--glow); letter-spacing: 2px; }
        #log-txt { font-size: 12px; color: #fff; margin-top: 10px; font-family: monospace; opacity: 0.7; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="aegis-core" onclick="initAegis()">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center-glow">AEGIS</div>
    </div>

    <div class="console">
        <div id="status-txt">OFFLINE</div>
        <div id="log-txt">> Click CORE to grant Mic Access...</div>
    </div>

    <script>
        const statusDisplay = document.getElementById('status-txt');
        const logDisplay = document.getElementById('log-txt');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Your browser does not support Speech Recognition. Please use Chrome.");
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;

        const synth = window.speechSynthesis;
        let isActivated = false;

        function speak(text) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 1.1;
            synth.speak(utter);
        }

        function initAegis() {
            try {
                recognition.start();
                statusDisplay.innerText = "LISTENING...";
                logDisplay.innerText = "> Monitoring for 'Hey Aegis'...";
                speak("Aegis systems active.");
            } catch (e) {
                console.log("Mic already on.");
            }
        }

        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript.toLowerCase();
            }

            logDisplay.innerText = "> Heard: " + transcript;

            // 1. WAKE WORD
            if (transcript.includes("hey aegis") || transcript.includes("hello aegis") || transcript.includes("aegis")) {
                if (!isActivated) {
                    isActivated = true;
                    statusDisplay.innerText = "ACTIVE";
                    speak("Yes Rohit, tell me.");
                }
            }

            // 2. COMMANDS (Triggers only after wake word)
            if (isActivated) {
                if (transcript.includes("play")) {
                    let song = transcript.split("play").pop().trim();
                    if(song) {
                        speak("Playing " + song);
                        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(song)}`, "_blank");
                        isActivated = false; // Reset for next wake word
                    }
                } else if (transcript.includes("search")) {
                    let query = transcript.split("search").pop().trim();
                    speak("Searching Google for " + query);
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
                    isActivated = false;
                }
            }
        };

        recognition.onend = () => {
            // Auto restart logic for PC/Mobile loop
            recognition.start();
            console.log("Mic restarted...");
        };

        recognition.onerror = (event) => {
            console.error("Speech Error: " + event.error);
            if (event.error === 'not-allowed') {
                alert("Mic permission denied! Please allow it from the address bar icon.");
            }
        };
    </script>
</body>
</html>
