<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI | Mobile Fix</title>
    <style>
        :root { --glow: #00f2ff; --dark: #000; }
        body { background: var(--dark); margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        .aegis-core { position: relative; width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top: 4px solid var(--glow); border-bottom: 4px solid var(--glow); animation: rotate 8s linear infinite; }
        .r2 { width: 80%; height: 80%; border-left: 3px dashed var(--glow); border-right: 3px dashed var(--glow); animation: rotate 5s linear reverse infinite; opacity: 0.6; }
        .center-glow { width: 80px; height: 80px; background: radial-gradient(circle, #fff, var(--glow), transparent); border-radius: 50%; box-shadow: 0 0 50px var(--glow); z-index: 10; display: flex; align-items: center; justify-content: center; color: #000; font-size: 14px; font-weight: 900; animation: breath 2s ease-in-out infinite; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes breath { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        .console { margin-top: 30px; width: 85%; max-width: 400px; border-left: 3px solid var(--glow); padding: 15px; background: rgba(0, 242, 255, 0.05); }
        #status-txt { font-size: 14px; color: var(--glow); letter-spacing: 2px; }
        #log-txt { font-size: 12px; color: #fff; margin-top: 10px; font-family: monospace; opacity: 0.7; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="aegis-core" onclick="activateAegis()">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center-glow">AEGIS</div>
    </div>

    <div class="console">
        <div id="status-txt">SYSTEM STANDBY</div>
        <div id="log-txt">> Tap core once to initialize system.</div>
    </div>

    <script>
        const statusDisplay = document.getElementById('status-txt');
        const logDisplay = document.getElementById('log-txt');
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.lang = 'en-US'; 
        recognition.continuous = true; 
        recognition.interimResults = false;

        let isWaitingForCommand = false;

        function speak(text) {
            const utter = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            utter.voice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Female')) || voices[0];
            utter.pitch = 1.1;
            utter.rate = 1.0;
            synth.speak(utter);
        }

        function activateAegis() {
            try {
                recognition.start();
                statusDisplay.innerText = "MONITORING...";
                logDisplay.innerText = "> System Ready. Say 'Hey Aegis'...";
                speak("Aegis online.");
            } catch (e) {
                console.log("Recognition active.");
            }
        }

        recognition.onresult = (event) => {
            const last = event.results.length - 1;
            const cmd = event.results[last][0].transcript.toLowerCase().trim();
            logDisplay.innerText = "> Heard: " + cmd;

            // 1. WAKE WORD DETECTION
            if (cmd.includes("hey aegis") || cmd.includes("hello aegis") || cmd.includes("aegis")) {
                isWaitingForCommand = true;
                statusDisplay.innerText = "ACTIVE - LISTENING";
                speak("Yes, what should I play?");
                return;
            }

            // 2. COMMAND LOGIC
            if (isWaitingForCommand) {
                if (cmd.includes("play") || cmd.includes("song")) {
                    let query = cmd.replace("play", "").replace("song", "").trim();
                    speak("Searching for " + query);
                    
                    const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                    
                    // Direct redirect for Mobile (to avoid popup block)
                    setTimeout(() => {
                        window.location.href = url; 
                    }, 1000);
                    
                    isWaitingForCommand = false;
                } else if (cmd.includes("search")) {
                    let query = cmd.replace("search", "").trim();
                    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    isWaitingForCommand = false;
                }
            }
        };

        // Mobile-e mic restart korar jonno forced loop
        recognition.onend = () => {
            recognition.start();
            statusDisplay.innerText = "MONITORING...";
        };

        recognition.onerror = (err) => {
            if(err.error === 'no-speech') {
                recognition.stop(); // restart trigger korbe
            }
        };
    </script>
</body>
</html>
